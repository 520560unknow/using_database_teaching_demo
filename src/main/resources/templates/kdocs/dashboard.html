<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金山文档PPT系统 - 课堂弹幕系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/cyberpunk-2077.css">
</head>
<body>
    <div class="container mt-5">
        <!-- 头部 -->
        <div class="card mb-5">
            <div class="card-header">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1><i class="fas fa-file-powerpoint"></i> 金山文档PPT系统</h1>
                        <p class="mb-0">基于金山文档的在线PPT播放系统</p>
                    </div>
                    <div class="col-md-4 text-end">
                        <a th:href="@{/teacher/dashboard(teacherId=${teacherId})}" class="btn btn-secondary btn-lg">
                            <i class="fas fa-arrow-left"></i> 返回教师仪表板
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 功能卡片 -->
        <div class="row">
            <div class="col-md-12">
                <div class="card mb-5">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-4 text-center">
                                <i class="fas fa-play" style="font-size: 4rem; margin-bottom: 20px;"></i>
                                <h4>PPT播放模式</h4>
                                <p>基于金山文档的在线PPT播放，支持师生互动</p>
                            </div>
                            <div class="col-md-8">
                                <form id="kdocsForm" onsubmit="submitKdocsUrl(event)">
                                    <div class="mb-4">
                                        <label for="kdocsUrl" class="form-label">金山文档PPT网址</label>
                                        <input type="url" class="form-control" id="kdocsUrl" placeholder="请输入金山文档PPT的分享链接" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-play-circle"></i> 开始播放
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <script>
                function submitKdocsUrl(event) {
                    event.preventDefault();
                    const kdocsUrl = document.getElementById('kdocsUrl').value;
                    if (kdocsUrl) {
                        // 跳转到播放页面并传递网址参数
                        window.location.href = `/kdocs/play?teacherId=[[${teacherId}]]&kdocsUrl=${encodeURIComponent(kdocsUrl)}`;
                    }
                }
            </script>

        </div>

        <!-- 系统信息 -->
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-info-circle"></i> 系统说明</h4>
            </div>
            <div class="card-body">
                <p><strong>基于金山文档的PPT播放系统</strong></p>
                <ul class="list-unstyled">
                    <li><i class="fas fa-check"></i> 使用金山文档在线编辑和播放PPT</li>
                    <li><i class="fas fa-check"></i> 支持师生实时互动评论</li>
                    <li><i class="fas fa-check"></i> 左侧PPT播放，右侧评论区</li>
                    <li><i class="fas fa-check"></i> 学生可以通过系统发送消息到教师端</li>
                    <li><i class="fas fa-check"></i> 完全在线，无需本地安装</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
