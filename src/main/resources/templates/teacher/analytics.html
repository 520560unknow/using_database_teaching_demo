<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学情看板 · 教师端</title>
    <style>
        :root { --bg:#05070d; --panel:rgba(14,20,34,.9); --line:rgba(0,229,255,.22); --cyan:#00e5ff; --pink:#ff2d95; --green:#39ff88; --text:#e8f4ff; --muted:#8fa6c4; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; color:var(--text); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
            background: radial-gradient(circle at 10% 5%, rgba(255,45,149,.14), transparent 30%),
                        radial-gradient(circle at 92% 8%, rgba(0,229,255,.13), transparent 32%),
                        linear-gradient(160deg,#05070d,#08101f 55%,#05070d); }
        .wrap { max-width:1180px; margin:0 auto; padding:26px 22px 40px; }
        header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
        h1 { margin:0; font-size:24px; letter-spacing:1px; }
        .sub { color:var(--muted); font-size:13px; margin-top:6px; line-height:1.7; }
        .links { display:flex; gap:8px; flex-wrap:wrap; }
        .btn { cursor:pointer; border:1px solid var(--line); background:rgba(0,229,255,.08); color:var(--cyan); border-radius:10px; padding:9px 13px; font-size:12px; font-family:inherit; text-decoration:none; white-space:nowrap; }
        .btn:hover { background:rgba(0,229,255,.16); }
        .btn.primary { background:linear-gradient(135deg,var(--cyan),#3f8cff); color:#031018; border:none; font-weight:700; }
        .filters { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
        input[type=text], select { padding:10px 12px; border-radius:10px; background:rgba(4,10,20,.9); border:1px solid rgba(0,229,255,.22); color:var(--text); font-family:inherit; outline:none; font-size:13px; }
        input[type=text] { width:260px; }
        .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
        .stat { padding:14px 16px; border-radius:14px; background:var(--panel); border:1px solid var(--line); }
        .stat span { color:var(--muted); font-size:12px; }
        .stat b { display:block; margin-top:6px; font-size:26px; color:var(--cyan); }
        .stat.pink b { color:var(--pink); }
        .stat.green b { color:var(--green); }
        .section { margin-bottom:18px; padding:18px; border-radius:16px; background:var(--panel); border:1px solid var(--line); box-shadow:0 14px 40px rgba(0,0,0,.28); }
        .section h2 { margin:0 0 4px; font-size:16px; letter-spacing:.5px; }
        .hint { margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.7; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .list { display:flex; flex-direction:column; gap:8px; }
        .item { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 12px; border-radius:10px; background:rgba(0,229,255,.04); border:1px solid rgba(0,229,255,.13); }
        .item .q { font-size:13px; line-height:1.6; word-break:break-all; }
        .item .count { flex:none; padding:3px 9px; border-radius:999px; font-size:12px; color:var(--cyan); background:rgba(0,229,255,.1); }
        .item.miss .count { color:var(--pink); background:rgba(255,45,149,.12); }
        .trend { display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:8px; }
        .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; min-width:0; }
        .bar .col { width:100%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,var(--cyan),rgba(0,229,255,.18)); min-height:2px; transition:height .3s; }
        .bar .day { font-size:10px; color:var(--muted); white-space:nowrap; }
        .bar .val { font-size:10px; color:var(--text); }
        .empty { padding:26px; text-align:center; color:var(--muted); border:1px dashed rgba(0,229,255,.2); border-radius:12px; font-size:12.5px; }
        .toast { position:fixed; right:22px; bottom:22px; padding:12px 16px; border-radius:12px; background:rgba(8,16,28,.96); border:1px solid var(--line); opacity:0; transform:translateY(10px); transition:.25s; font-size:13px; }
        .toast.show { opacity:1; transform:translateY(0); }
        @media (max-width:820px){ .stats{grid-template-columns:1fr 1fr;} .grid2{grid-template-columns:1fr;} input[type=text]{width:100%;} }
    </style>
<script src="/js/app-config.js"></script>
<script src="/js/ui-common.js"></script>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>学情看板</h1>
            <div class="sub">统计来自真实提问日志（ai-usage.jsonl）与转人工队列，不做任何模拟数据。</div>
        </div>
        <div class="links">
            <a class="btn" id="backDashboard" href="#">返回工作台</a>
            <a class="btn" id="backAi" href="#">答疑资料库</a>
        </div>
    </header>

    <div class="filters">
        <input type="text" id="classroom" placeholder="按课堂 ID 过滤，留空查看全部" />
        <select id="days">
            <option value="1">最近 1 天</option>
            <option value="7" selected>最近 7 天</option>
            <option value="30">最近 30 天</option>
            <option value="90">最近 90 天</option>
        </select>
        <button class="btn primary" id="refresh">刷新数据</button>
    </div>

    <div class="stats">
        <div class="stat"><span>提问总数</span><b id="total">0</b></div>
        <div class="stat green"><span>资料命中率</span><b id="hitRate">0%</b></div>
        <div class="stat pink"><span>未命中问题</span><b id="miss">0</b></div>
        <div class="stat"><span>平均响应</span><b id="latency">0 ms</b></div>
        <div class="stat"><span>模型回答 / 纯检索</span><b id="modes">0 / 0</b></div>
        <div class="stat pink"><span>转人工待回复</span><b id="pending">0</b></div>
    </div>

    <div class="section">
        <h2>提问趋势</h2>
        <p class="hint">按天统计学生提问次数。</p>
        <div class="trend" id="trend"></div>
    </div>

    <div class="grid2">
        <div class="section">
            <h2>高频问题</h2>
            <p class="hint">同一问题的不同标点写法已自动归并。</p>
            <div class="list" id="topQuestions"></div>
        </div>
        <div class="section">
            <h2>未命中问题（资料盲区）</h2>
            <p class="hint">这些提问没有在资料库中找到依据，建议补充课件或转人工回复。</p>
            <div class="list" id="missedQuestions"></div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
    const classroomInput = document.getElementById('classroom');
    const daysSelect = document.getElementById('days');
    const teacherId = AppConfig.teacherId();

    classroomInput.value = AppConfig.classroomId();
    document.getElementById('backDashboard').href = '/teacher/dashboard' + (teacherId ? '?teacherId=' + encodeURIComponent(teacherId) : '');
    document.getElementById('backAi').href = '/teacher/ai' + (teacherId ? '?teacherId=' + encodeURIComponent(teacherId) : '');

    const esc = UiCommon.esc;

    function toast(message) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function renderTrend(items) {
        const container = document.getElementById('trend');
        const max = Math.max(1, Math.max.apply(null, items.map(i => i.count || 0)));
        container.innerHTML = items.map(item => {
            const height = Math.round((item.count || 0) / max * 118);
            const day = String(item.date || '').slice(5);
            return `<div class="bar" title="${esc(item.date)} · ${item.count} 次">
                        <div class="val">${item.count}</div>
                        <div class="col" style="height:${height}px"></div>
                        <div class="day">${esc(day)}</div>
                    </div>`;
        }).join('');
    }

    function renderList(containerId, items, missed) {
        const container = document.getElementById(containerId);
        if (!items || items.length === 0) {
            container.innerHTML = '<div class="empty">暂无数据</div>';
            return;
        }
        container.innerHTML = items.map(item => `
            <div class="item${missed ? ' miss' : ''}">
                <div class="q">${esc(item.question)}</div>
                <div class="count">${item.count} 次</div>
            </div>`).join('');
    }

    async function load() {
        const classroomId = classroomInput.value.trim();
        const days = daysSelect.value;
        const url = `/api/ai/analytics?days=${encodeURIComponent(days)}`
            + (classroomId ? `&classroomId=${encodeURIComponent(classroomId)}` : '');
        try {
            const response = await fetch(url);
            const data = await response.json();

            document.getElementById('total').textContent = data.total || 0;
            document.getElementById('hitRate').textContent = (data.hitRate || 0) + '%';
            document.getElementById('miss').textContent = data.miss || 0;
            document.getElementById('latency').textContent = (data.avgLatencyMs || 0) + ' ms';
            document.getElementById('modes').textContent = (data.llmCount || 0) + ' / ' + (data.retrievalCount || 0);
            document.getElementById('pending').textContent = (data.desk && data.desk.pending) || 0;

            renderTrend(data.byDay || []);
            renderList('topQuestions', data.topQuestions || [], false);
            renderList('missedQuestions', data.missedQuestions || [], true);
        } catch (error) {
            toast('加载失败：' + error.message);
        }
    }

    document.getElementById('refresh').addEventListener('click', () => {
        load();
        toast('已刷新');
    });
    classroomInput.addEventListener('change', load);
    daysSelect.addEventListener('change', load);

    load();
</script>
</body>
</html>
