<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自主学习工作台 · 教师端</title>
    <style>
        :root { --bg:#05070d; --panel:rgba(14,20,34,.9); --line:rgba(0,229,255,.22); --cyan:#00e5ff; --pink:#ff2d95; --green:#39ff88; --text:#e8f4ff; --muted:#8fa6c4; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; color:var(--text); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
            background: radial-gradient(circle at 10% 5%, rgba(255,45,149,.14), transparent 30%),
                        radial-gradient(circle at 92% 8%, rgba(0,229,255,.13), transparent 32%),
                        linear-gradient(160deg,#05070d,#08101f 55%,#05070d); }
        .wrap { max-width:1180px; margin:0 auto; padding:26px 22px 40px; }
        header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; }
        h1 { margin:0; font-size:24px; letter-spacing:1px; }
        .sub { color:var(--muted); font-size:13px; margin-top:4px; }
        .badge { padding:7px 11px; border:1px solid var(--line); border-radius:999px; color:var(--cyan); background:rgba(0,229,255,.06); font-size:12px; }
        .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
        .stat { padding:14px 16px; border-radius:14px; background:var(--panel); border:1px solid var(--line); }
        .stat span { color:var(--muted); font-size:12px; }
        .stat b { display:block; margin-top:6px; font-size:26px; color:var(--cyan); }
        .stat.pink b { color:var(--pink); }
        .stat.green b { color:var(--green); }
        .section { margin-bottom:18px; padding:18px; border-radius:16px; background:var(--panel); border:1px solid var(--line); box-shadow:0 14px 40px rgba(0,0,0,.28); }
        .section h2 { margin:0 0 4px; font-size:16px; letter-spacing:.5px; }
        .hint { margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.7; }
        .row { display:flex; gap:8px; margin-bottom:10px; }
        input[type=text], textarea { width:100%; padding:11px 13px; border-radius:10px; background:rgba(4,10,20,.9); border:1px solid rgba(0,229,255,.22); color:var(--text); font-family:inherit; outline:none; }
        textarea { min-height:96px; resize:vertical; }
        .btn { cursor:pointer; border:1px solid var(--line); background:rgba(0,229,255,.08); color:var(--cyan); border-radius:10px; padding:9px 13px; font-size:12px; font-family:inherit; white-space:nowrap; }
        .btn:hover { background:rgba(0,229,255,.16); }
        .btn.primary { background:linear-gradient(135deg,var(--cyan),#3f8cff); color:#031018; border:none; font-weight:700; }
        .btn.pink { color:var(--pink); border-color:rgba(255,45,149,.3); background:rgba(255,45,149,.08); }
        .materials { display:flex; flex-direction:column; gap:8px; }
        .material { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:11px 13px; border-radius:10px; background:rgba(0,229,255,.04); border:1px solid rgba(0,229,255,.13); }
        .material .name { font-size:13px; font-weight:600; }
        .material .meta { color:var(--muted); font-size:11.5px; margin-top:4px; }
        .queue { display:flex; flex-direction:column; gap:12px; }
        .card { padding:16px; border-radius:16px; background:rgba(20,28,46,.7); border:1px solid rgba(0,229,255,.16); }
        .q { font-size:15px; line-height:1.7; font-weight:600; }
        .meta-line { color:var(--muted); font-size:11.5px; margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; }
        .tag { padding:3px 7px; border-radius:6px; background:rgba(255,45,149,.1); color:var(--pink); }
        .tag.ok { background:rgba(57,255,136,.1); color:var(--green); }
        .answer-box { display:flex; gap:8px; margin-top:12px; }
        .answer-box textarea { flex:1; min-height:64px; }
        .empty { padding:28px; text-align:center; color:var(--muted); border:1px dashed rgba(0,229,255,.2); border-radius:12px; font-size:12.5px; }
        .done { opacity:.55; }
        .toast { position:fixed; right:22px; bottom:22px; padding:12px 16px; border-radius:12px; background:rgba(8,16,28,.96); border:1px solid var(--line); opacity:0; transform:translateY(10px); transition:.25s; font-size:13px; }
        .toast.show { opacity:1; transform:translateY(0); }
        .dropzone { margin:0 0 12px; padding:22px 16px; border-radius:12px; border:1.5px dashed rgba(0,229,255,.35); background:rgba(0,229,255,.04); text-align:center; color:var(--muted); font-size:13px; cursor:pointer; transition:.2s; }
        .dropzone:hover { border-color:rgba(0,229,255,.6); background:rgba(0,229,255,.07); }
        .dropzone.dragover { border-color:var(--pink); background:rgba(255,45,149,.1); color:var(--text); box-shadow:0 0 26px rgba(255,45,149,.22); }
        .dropzone .dz-icon { font-size:22px; color:var(--cyan); margin-bottom:8px; }
        .dropzone strong { color:var(--cyan); }
        .dropzone .dz-sub { font-size:12px; margin-top:6px; }
        @media (max-width:820px){ .stats{grid-template-columns:1fr 1fr;} header{flex-direction:column;align-items:flex-start;} }
    </style>
<script src="/js/app-config.js"></script>
<script src="/js/ui-common.js"></script>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>自主学习工作台</h1>
            <div class="sub">教师上传课件资料 → 进入知识库 → 学生课前预习时可检索、可追问。</div>
        </div>
        <span class="badge" id="roomBadge">全部课堂</span>
    </header>

    <div class="stats">
        <div class="stat"><span>资料文件</span><b id="fileCount">0</b></div>
        <div class="stat green"><span>知识片段</span><b id="chunkCount">0</b></div>
        <div class="stat pink"><span>待回复问题</span><b id="pending">0</b></div>
        <div class="stat"><span>学生提问次数</span><b id="askCount">0</b></div>
    </div>

    <div class="section">
        <h2>资料入库</h2>
        <p class="hint">粘贴课件正文，或拖拽 .txt / .md 文本入库。入库后立即生效，学生在“自主学习”页即可检索到。</p>
        <div class="dropzone" id="dropzone">
            <div class="dz-icon">↓</div>
            <div><strong>把文件拖到这里</strong>，支持 .txt / .md，可一次拖多个</div>
            <div class="dz-sub">也可以点击此区域选择文件</div>
        </div>
        <div class="row"><input type="text" id="title" placeholder="资料标题，例如：第 3 章 视频树结构讲义" /></div>
        <div class="row"><textarea id="content" placeholder="粘贴课件或讲义正文，按小节分段效果更好"></textarea></div>
        <div class="row">
            <button class="btn primary" id="submitText">保存并入库</button>
            <input type="file" id="file" accept=".txt,.md" style="display:none" />
            <button class="btn" id="pickFile">上传文本文件</button>
            <button class="btn" id="refreshMaterials">刷新资料</button>
        </div>
        <div class="materials" id="materials"></div>
    </div>

    <div class="section">
        <h2>学生提问回顾</h2>
        <p class="hint">最近的检索记录，用于发现资料盲区和高频卡点。</p>
        <div class="queue" id="logs"></div>
    </div>

    <div class="section">
        <h2>转人工答疑</h2>
        <p class="hint">学生转交的问题集中在这里；回复后会自动补进知识库。</p>
        <div class="row"><input type="text" id="classroom" placeholder="按课堂 ID 过滤，留空查看全部" /></div>
        <div class="queue" id="queue"></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
    const roomInput = document.getElementById('classroom');
    roomInput.value = AppConfig.classroomId();
    document.getElementById('roomBadge').textContent = roomInput.value ? ('课堂 ' + roomInput.value) : '全部课堂';

    const esc = UiCommon.esc;
    function toast(text) {
        const el = document.getElementById('toast');
        el.textContent = text; el.classList.add('show');
        setTimeout(function(){ el.classList.remove('show'); }, 2400);
    }

    async function loadMaterials() {
        const room = roomInput.value.trim();
        try {
            const res = await fetch('/api/ai/materials' + (room ? ('?classroomId=' + encodeURIComponent(room)) : ''), {cache: 'no-store'});
            const data = await res.json();
            document.getElementById('fileCount').textContent = data.fileCount;
            document.getElementById('chunkCount').textContent = data.chunkCount;
            const box = document.getElementById('materials');
            if (!data.items || !data.items.length) {
                box.innerHTML = '<div class="empty">还没有资料，先粘贴或上传一份讲义。</div>';
                return;
            }
            box.innerHTML = '';
            data.items.forEach(function (item) {
                const div = document.createElement('div');
                div.className = 'material';
                div.innerHTML = '<div><div class="name">' + esc(item.title) + '</div>' +
                    '<div class="meta">' + esc(item.name) + ' · ' + item.chunks + ' 个片段 · 更新 ' + esc(item.modified) + '</div></div>' +
                    '<button class="btn pink">删除</button>';
                div.querySelector('button').addEventListener('click', async function () {
                    if (!confirm('删除资料「' + item.title + '」？')) return;
                    const r = await fetch('/api/ai/material/delete?name=' + encodeURIComponent(item.name)
                        + '&classroomId=' + encodeURIComponent(roomInput.value.trim()), {method: 'DELETE'});
                    const d = await r.json();
                    if (d.ok) { toast('已删除'); loadMaterials(); } else { toast(d.error || '删除失败'); }
                });
                box.appendChild(div);
            });
        } catch (e) {
            toast('加载资料失败，请确认本地服务已启动');
        }
    }

    async function loadLogs() {
        try {
            const res = await fetch('/api/ai/logs?limit=8', {cache: 'no-store'});
            const data = await res.json();
            const box = document.getElementById('logs');
            const items = data.items || [];
            document.getElementById('askCount').textContent = items.length;
            if (!items.length) {
                box.innerHTML = '<div class="empty">还没有学生提问记录。</div>';
                return;
            }
            box.innerHTML = '';
            items.forEach(function (item) {
                const div = document.createElement('div');
                div.className = 'card';
                const mode = item.mode === 'llm' ? '本地 AI 生成' : '资料检索';
                div.innerHTML = '<div class="q">' + esc(item.question) + '</div>' +
                    '<div class="meta-line"><span class="tag' + (item.lowConfidence ? '' : ' ok') + '">' +
                    (item.lowConfidence ? '未命中资料' : '已命中资料') + '</span>' +
                    '<span>' + esc(mode) + '</span><span>' + esc(item.latencyMs) + ' ms</span>' +
                    '<span>' + esc(item.ts) + '</span></div>';
                box.appendChild(div);
            });
        } catch (e) { /* 忽略 */ }
    }

    async function loadQueue() {
        const room = roomInput.value.trim();
        const url = '/api/ai/unanswered' + (room ? ('?classroomId=' + encodeURIComponent(room)) : '');
        try {
            const res = await fetch(url, {cache: 'no-store'});
            const data = await res.json();
            document.getElementById('pending').textContent = data.stats.pending;
            renderQueue(data.items || []);
        } catch (e) {
            toast('加载失败，请确认本地服务已启动');
        }
    }

    function renderQueue(items) {
        const queue = document.getElementById('queue');
        if (!items.length) {
            queue.innerHTML = '<div class="empty">暂无待回复问题。学生点“转人工教师”后会出现在这里。</div>';
            return;
        }
        queue.innerHTML = '';
        items.slice().reverse().forEach(function (item) {
            const card = document.createElement('div');
            const answered = item.status === 'answered';
            card.className = 'card' + (answered ? ' done' : '');
            card.innerHTML = '<div class="q">' + esc(item.question) + '</div>' +
                '<div class="meta-line"><span class="tag' + (answered ? ' ok' : '') + '">' + (answered ? '已回复' : '待回复') + '</span>' +
                '<span>课堂 ' + esc(item.classroomId || '未绑定') + '</span>' +
                '<span>匿名学生</span>' +
                '<span>' + esc(item.createdAt || '') + '</span></div>' +
                (answered
                    ? '<div class="meta-line">回复：' + esc(item.answer || '') + '</div>'
                    : '<div class="answer-box"><textarea placeholder="写下回复，提交后自动加入知识库"></textarea>' +
                      '<button class="btn primary">回复并入库</button></div>');
            if (!answered) {
                const btn = card.querySelector('button');
                const ta = card.querySelector('textarea');
                btn.addEventListener('click', async function () {
                    const text = ta.value.trim();
                    if (!text) { toast('请先填写回复'); return; }
                    btn.disabled = true;
                    try {
                        const res = await fetch('/api/ai/answer', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({id: item.id, answer: text, teacherId: AppConfig.teacherId()})
                        });
                        const data = await res.json();
                        if (data.ok) { toast('已回复并加入知识库'); loadQueue(); loadMaterials(); }
                        else { toast(data.error || '提交失败'); btn.disabled = false; }
                    } catch (e) { toast('提交失败'); btn.disabled = false; }
                });
            }
            queue.appendChild(card);
        });
    }

    document.getElementById('submitText').addEventListener('click', async function () {
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        if (!content) { toast('请先粘贴资料内容'); return; }
        const btn = this;
        btn.disabled = true;
        try {
            const res = await fetch('/api/ai/material', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: title, content: content, classroomId: roomInput.value.trim()})
            });
            const data = await res.json();
            if (data.ok) {
                toast('资料已入库，学生可立即检索');
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                loadMaterials();
            } else { toast(data.error || '保存失败'); }
        } catch (e) { toast('保存失败'); }
        btn.disabled = false;
    });

    const fileInput = document.getElementById('file');
    const dropzone = document.getElementById('dropzone');

    document.getElementById('pickFile').addEventListener('click', function () {
        fileInput.click();
    });
    dropzone.addEventListener('click', function () {
        fileInput.click();
    });

    async function uploadFiles(fileList) {
        const files = Array.from(fileList || []).filter(function (f) {
            return /\.(txt|md)$/i.test(f.name);
        });
        if (!files.length) {
            toast('仅支持 .txt / .md 文本文件');
            return;
        }

        let ok = 0;
        for (const f of files) {
            const form = new FormData();
            form.append('file', f);
            form.append('classroomId', roomInput.value.trim());
            try {
                const res = await fetch('/api/ai/material/upload', {method: 'POST', body: form});
                const data = await res.json();
                if (data.ok) { ok++; }
            } catch (e) {
                // 单个文件失败不影响其余文件
            }
        }
        toast(ok ? ('已入库 ' + ok + ' 个文件') : '上传失败');
        loadMaterials();
    }

    fileInput.addEventListener('change', async function () {
        await uploadFiles(this.files);
        this.value = '';
    });

    ['dragenter', 'dragover'].forEach(function (name) {
        dropzone.addEventListener(name, function (e) {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
    });
    ['dragleave', 'drop'].forEach(function (name) {
        dropzone.addEventListener(name, function (e) {
            e.preventDefault();
            dropzone.classList.remove('dragover');
        });
    });
    dropzone.addEventListener('drop', function (e) {
        uploadFiles(e.dataTransfer.files);
    });

    // 防止浏览器在页面其他区域打开被拖入的文件
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });

    document.getElementById('refreshMaterials').addEventListener('click', loadMaterials);
    roomInput.addEventListener('change', function () { loadQueue(); loadMaterials(); });

    loadMaterials();
    loadLogs();
    loadQueue();
    setInterval(loadQueue, 5000);
</script>
</body>
</html>
