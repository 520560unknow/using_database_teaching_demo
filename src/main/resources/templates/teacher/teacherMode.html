    // 选择元素
    function selectCell(cell) {
        // 清除之前的选择
        clearSelection();

        selectedCell = cell;

        // 添加选中样式
        if (cell.isElement()) {
            cell.attr({
                body: {
                    stroke: '#48bb78',
                    strokeWidth: 3,
                    filter: 'url(#drop-shadow)'
                }
            });
        } else if (cell.isLink()) {
            cell.attr({
                line: {
                    stroke: '#48bb78',
                    strokeWidth: 3
                }
            });
        }
    }

    // 清除选择
    function clearSelection() {
        if (selectedCell) {
            if (selectedCell.isElement()) {
                selectedCell.attr({
                    body: {
                        stroke: '#667eea',
                        strokeWidth: 2,
                        filter: 'none'
                    }
                });
            } else if (selectedCell.isLink()) {
                selectedCell.attr({
                    line: {
                        stroke: '#a0aec0',
                        strokeWidth: 2
                    }
                });
            }
            selectedCell = null;
        }
    }

    // 填充编辑表单
    function fillEditForm(cell) {
        if (!cell || !cell.isElement()) return;

        document.getElementById('editNodeId').value = cell.id;
        document.getElementById('editNodeName').value = cell.get('name') || '';
        document.getElementById('editNodeDesc').value = cell.get('description') || '';

        // 显示文件名而不是完整的URL
        const videoUrl = cell.get('videoUrl') || '';
        const fileName = cell.get('fileName') || '';
        document.getElementById('editNodeVideo').value = fileName || videoUrl;
        
        // 显示关键词
        const keywords = cell.get('keywords') || [];
        document.getElementById('editNodeKeywords').value = keywords.join(', ');
    }

    // 清空编辑表单
    function clearEditForm() {
        document.getElementById('editNodeId').value = '';
        document.getElementById('editNodeName').value = '';
        document.getElementById('editNodeDesc').value = '';
        document.getElementById('editNodeVideo').value = '';
        document.getElementById('connectionList').innerHTML = `
                <div style="text-align: center; padding: 20px; color: #999;">
                    选择节点以查看连接
                </div>
            `;
    }

    // 更新节点
    function updateNode() {
        if (!selectedCell || !selectedCell.isElement()) {
            updateStatus('请先选择节点', 'error');
            return;
        }

        const name = document.getElementById('editNodeName').value.trim();
        if (!name) {
            alert('请输入节点名称，节点名称是必填项');
            updateStatus('节点名称不能为空', 'error');
            return;
        }

        const videoInput = document.getElementById('editNodeVideo');

        // 如果用户选择了新文件
        if (videoInput.dataset.videoUrl) {
            selectedCell.set('videoUrl', videoInput.dataset.videoUrl);
            selectedCell.set('fileName', videoInput.dataset.fileName);
        } else if (videoInput.value.trim() && videoInput.value !== selectedCell.get('fileName')) {
            // 用户输入了新路径
            selectedCell.set('videoUrl', videoInput.value.trim());
            selectedCell.set('fileName', videoInput.value.split('/').pop().split('\\').pop());
        }

        selectedCell.set('name', name);
        selectedCell.set('description', document.getElementById('editNodeDesc').value);
        
        // 更新关键词
        const keywordsInput = document.getElementById('editNodeKeywords').value.trim();
        let keywords = [];
        if (keywordsInput) {
            keywords = keywordsInput.split(',').map(keyword => keyword.trim()).filter(keyword => keyword.length > 0);
        }
        selectedCell.set('keywords', keywords);

        // 更新显示
        selectedCell.attr({
            label: { text: name },
            description: { text: document.getElementById('editNodeDesc').value || '暂无描述' }
        });

        updateStatus('节点已更新', 'success');
    }

    // 删除节点
    function deleteNode() {
        if (!selectedCell) {
            updateStatus('请先选择节点', 'error');
            return;
        }

        if (confirm('确定要删除这个节点吗？所有相关连接也会被删除！')) {
            graph.removeCells([selectedCell]);
            clearEditForm();
            updateStatus('节点已删除', 'success');
            updateStats();
        }
    }

    // 克隆节点
    function cloneNode() {
        if (!selectedCell || !selectedCell.isElement()) {
            updateStatus('请先选择节点', 'error');
            return;
        }

        const originalNode = selectedCell;
        const name = originalNode.get('name') + ' - 副本';
        const description = originalNode.get('description');
        const videoUrl = originalNode.get('videoUrl');
        const fileName = originalNode.get('fileName');

        const newNode = createNodeElement(name, description, videoUrl);
        newNode.set('fileName', fileName);

        const position = originalNode.position();
        newNode.position(position.x + 50, position.y + 50);
        graph.addCell(newNode);

        selectCell(newNode);
        fillEditForm(newNode);
        updateStatus('节点已克隆', 'success');
    }

    // 删除选中元素
    function deleteSelected() {
        if (!selectedCell) {
            updateStatus('请先选择元素', 'error');
            return;
        }

        if (selectedCell.isElement()) {
            deleteNode();
        } else if (selectedCell.isLink()) {
            graph.removeCells([selectedCell]);
            clearSelection();
            updateStatus('连接已删除', 'success');
            updateStats();
        }
    }

    // 设置工具
    function setTool(tool) {
        currentTool = tool;

        // 更新工具栏
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        if (tool === 'select') {
            document.getElementById('tool-select').classList.add('active');
            document.getElementById('connectionHint').style.display = 'none';
            cancelConnectionMode();
        } else if (tool === 'connect') {
            document.getElementById('tool-connect').classList.add('active');
            startConnection();
        }

        document.getElementById('statusTool').textContent =
            tool === 'select' ? '选择' : tool === 'connect' ? '连接' : tool;
    }

    // 开始连接模式
    function startConnection() {
        if (connectionMode) {
            cancelConnectionMode();
            return;
        }

        if (!selectedCell || !selectedCell.isElement()) {
            updateStatus('请先选择一个节点作为连接源', 'error');
            return;
        }

        connectionMode = true;
        connectionSource = selectedCell;

        // 显示连接提示
        document.getElementById('connectionHint').style.display = 'block';

        // 高亮源节点
        connectionSource.attr({
            body: {
                stroke: '#f56565',
                strokeWidth: 3
            }
        });

        updateStatus('点击目标节点完成连接', 'info');
    }

    // 完成连接
    function completeConnection(targetNode) {
        if (!connectionSource || !targetNode || !connectionMode) return;

        if (connectionSource.id === targetNode.id) {
            updateStatus('不能连接到自身', 'error');
            return;
        }

        const label = document.getElementById('connectionLabel').value || '连接';
        const link = createConnection(connectionSource, targetNode, label);

        if (link) {
            updateStatus('连接创建成功', 'success');
        }

        cancelConnectionMode();
    }

    // 取消连接模式
    function cancelConnectionMode() {
        if (connectionSource) {
            // 恢复源节点样式
            connectionSource.attr({
                body: {
                    stroke: '#667eea',
                    strokeWidth: 2
                }
            });
        }

        connectionMode = false;
        connectionSource = null;

        document.getElementById('connectionHint').style.display = 'none';

        setTool('select');
    }

    // 更新连接列表
    function updateConnectionList(cell) {
        const list = document.getElementById('connectionList');
        list.innerHTML = '';

        if (!cell || !cell.isElement()) return;

        // 获取出向连接
        const outgoingLinks = graph.getConnectedLinks(cell, { outbound: true });
        // 获取入向连接
        const incomingLinks = graph.getConnectedLinks(cell, { inbound: true });

        if (outgoingLinks.length === 0 && incomingLinks.length === 0) {
            list.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #999;">
                        此节点暂无连接
                    </div>
                `;
            return;
        }

        // 显示出向连接
        if (outgoingLinks.length > 0) {
            outgoingLinks.forEach(link => {
                const targetNode = graph.getCell(link.get('target').id);
                if (targetNode) {
                    const item = document.createElement('div');
                    item.className = 'connection-item';
                    item.innerHTML = `
                            <div class="connection-info">
                                连接到: <span class="connection-target">${targetNode.get('name')}</span>
                            </div>
                            <button class="btn btn-outline btn-sm" style="padding: 4px 8px; font-size: 12px;"
                                    onclick="deleteConnection('${link.id}')">
                                <i class="fas fa-times"></i>
                            </button>
                        `;
                    list.appendChild(item);
                }
            });
        }

        // 显示入向连接
        if (incomingLinks.length > 0) {
            incomingLinks.forEach(link => {
                const sourceNode = graph.getCell(link.get('source').id);
                if (sourceNode) {
                    const item = document.createElement('div');
                    item.className = 'connection-item';
                    item.innerHTML = `
                            <div class="connection-info">
                                来自: <span class="connection-target">${sourceNode.get('name')}</span>
                            </div>
                        `;
                    list.appendChild(item);
                }
            });
        }
    }

    // 删除连接
    function deleteConnection(linkId) {
        const link = graph.getCell(linkId);
        if (link) {
            graph.removeCells([link]);

            if (selectedCell) {
                updateConnectionList(selectedCell);
            }

            updateStats();
            updateStatus('连接已删除', 'success');
        }
    }

    // 编辑连接
    function editConnection() {
        if (!selectedCell || !selectedCell.isLink()) {
            updateStatus('请先选择一条连接', 'error');
            return;
        }

        const currentLabel = selectedCell.get('label') || '';
        const newLabel = prompt('请输入新的连接标签:', currentLabel);

        if (newLabel !== null) {
            selectedCell.set('label', newLabel);
            selectedCell.attr({
                labels: [{
                    position: 0.5,
                    attrs: {
                        text: {
                            text: newLabel || '连接',
                            fontSize: 12,
                            fill: '#2d3748'
                        }
                    }
                }]
            });
            updateStatus('连接标签已更新', 'success');
        }
    }

    // 自动布局
    function autoLayout() {
        const elements = graph.getElements();
        if (elements.length === 0) return;

        // 找出根节点（没有入向连接的节点）
        const rootCandidates = elements.filter(node => {
            const incomingLinks = graph.getConnectedLinks(node, { inbound: true });
            return incomingLinks.length === 0;
        });

        const root = rootCandidates.length > 0 ? rootCandidates[0] : elements[0];

        // 设置根节点位置
        const paperWidth = paper.el.clientWidth;
        root.position(paperWidth / 2 - 90, 100);

        // 递归布局子节点
        const visited = new Set();
        const queue = [{ node: root, level: 0, index: 0 }];
        visited.add(root.id);

        while (queue.length > 0) {
            const { node, level, index } = queue.shift();

            // 获取子节点
            const childLinks = graph.getConnectedLinks(node, { outbound: true });
            const children = childLinks.map(link => graph.getCell(link.get('target').id))
                .filter(child => child && !visited.has(child.id));

            if (children.length > 0) {
                const levelY = 100 + (level + 1) * 150;
                const spacing = 250;
                const startX = node.position().x + node.size().width / 2 - (children.length - 1) * spacing / 2;

                children.forEach((child, i) => {
                    child.position(startX + i * spacing, levelY);
                    visited.add(child.id);
                    queue.push({ node: child, level: level + 1, index: i });
                });
            }
        }

        // 更新连接线
        graph.getLinks().forEach(link => {
            link.updateVertices();
        });

        updateStatus('自动布局完成', 'success');
    }

    // 更新统计信息
    function updateStats() {
        const nodeCount = graph.getElements().length;
        const connectionCount = graph.getLinks().length;

        document.getElementById('nodeCount').textContent = nodeCount;
        document.getElementById('connectionCount').textContent = connectionCount;
        document.getElementById('statusNodeCount').textContent = nodeCount;
        document.getElementById('statusConnectionCount').textContent = connectionCount;
    }

    // 更新缩放显示
    function updateZoomDisplay() {
        const scale = paper.scale();
        const zoomPercent = Math.round(scale.sx * 100);
        document.getElementById('statusZoom').textContent = zoomPercent + '%';
    }

    // 更新状态消息
    function updateStatus(message, type = 'info') {
        const statusMessage = document.getElementById('statusMessage');
        statusMessage.textContent = message;

        switch(type) {
            case 'success':
                statusMessage.style.color = '#48bb78';
                break;
            case 'error':
                statusMessage.style.color = '#f56565';
                break;
            case 'warning':
                statusMessage.style.color = '#ed8936';
                break;
            case 'info':
                statusMessage.style.color = '#667eea';
                break;
            default:
                statusMessage.style.color = '#cbd5e0';
        }
    }

    // 保存树
    function saveTree() {
        try {
            const elements = graph.getElements();
            const links = graph.getLinks();

            const treeData = {
                elements: elements.map(el => ({
                    id: el.id,
                    name: el.get('name'),
                    description: el.get('description'),
                    videoUrl: el.get('videoUrl'),
                    fileName: el.get('fileName'),
                    fileSize: el.get('fileSize'),
                    fileType: el.get('fileType'),
                    keywords: el.get('keywords') || [],
                    position: el.position(),
                    size: el.size()
                })),
                links: links.map(link => ({
                    id: link.id,
                    source: link.get('source'),
                    target: link.get('target'),
                    label: link.get('label') || ''
                })),
                currentNodeId: currentNodeId,
                currentConnectionId: currentConnectionId,
                saveTime: new Date().toISOString()
            };

            localStorage.setItem('videoTreeData', JSON.stringify(treeData));
            updateStatus('树已保存到本地存储', 'success');
        } catch (error) {
            console.error('保存失败:', error);
            updateStatus('保存失败: ' + error.message, 'error');
        }
    }

    // 加载树
    function loadTree() {
        const saved = localStorage.getItem('videoTreeData');
        if (!saved) {
            updateStatus('没有找到保存的树', 'error');
            return;
        }

        try {
            const treeData = JSON.parse(saved);

            // 清除当前图形
            graph.clear();

            // 恢复计数器
            currentNodeId = treeData.currentNodeId || 1;
            currentConnectionId = treeData.currentConnectionId || 1;

            // 创建节点
            treeData.elements.forEach(elData => {
                const node = createNodeElement(elData.name, elData.description, elData.videoUrl);

                // 恢复文件信息
                node.set('fileName', elData.fileName);
                node.set('fileSize', elData.fileSize);
                node.set('fileType', elData.fileType);
                // 恢复关键词
                node.set('keywords', elData.keywords || []);

                graph.addCell(node);
            });

            // 创建连接
            treeData.links.forEach(linkData => {
                const link = new joint.shapes.standard.Link({
                    id: linkData.id,
                    source: linkData.source,
                    target: linkData.target,
                    attrs: linkData.attrs
                });

                link.set('label', linkData.label || '');

                graph.addCell(link);
            });

            updateStats();
            clearSelection();
            clearEditForm();

            updateStatus('树已加载', 'success');
            ensureButtonsVisible();
        } catch (e) {
            updateStatus('加载失败: ' + e.message, 'error');
        }
    }

    // 导出树
    function exportTree() {
        const elements = graph.getElements();
        const links = graph.getLinks();

        const treeData = {
            metadata: {
                name: "视频树项目",
                created: new Date().toISOString(),
                version: "1.0",
                type: "video-tree"
            },
            elements: elements.map(el => ({
                id: el.id,
                name: el.get('name'),
                description: el.get('description'),
                videoUrl: el.get('videoUrl') || '',
                fileName: el.get('fileName') || '',
                fileSize: el.get('fileSize') || 0,
                fileType: el.get('fileType') || '',
                keywords: el.get('keywords') || [],
                position: el.position(),
                size: el.size()
            })),
            links: links.map(link => ({
                id: link.id,
                source: link.get('source'),
                target: link.get('target'),
                label: link.get('label') || ''
            })),
            exportTime: new Date().toISOString()
        };

        const dataStr = JSON.stringify(treeData, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);

        const exportFileDefaultName = `视频树_${new Date().getTime()}.json`;

        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        document.body.appendChild(linkElement);
        linkElement.click();
        document.body.removeChild(linkElement);

        updateStatus('视频树已导出为JSON文件', 'success');
    }

    // 导入树
    function importTree() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json,.txt';

        input.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const treeData = JSON.parse(e.target.result);

                    // 清除当前图形
                    graph.clear();
                    currentNodeId = 1;
                    currentConnectionId = 1;

                    // 创建节点
                    if (treeData.elements && Array.isArray(treeData.elements)) {
                        treeData.elements.forEach(elData => {
                            const node = createNodeElement(elData.name, elData.description, elData.videoUrl);

                            // 恢复文件信息
                            node.set('fileName', elData.fileName);
                            node.set('fileSize', elData.fileSize);
                            node.set('fileType', elData.fileType);

                            if (elData.position) {
                                node.position(elData.position.x, elData.position.y);
                            } else {
                                node.position(100 + Math.random() * 300, 100 + Math.random() * 300);
                            }
                            graph.addCell(node);
                        });
                    }

                    // 创建连接
                    if (treeData.links && Array.isArray(treeData.links)) {
                        treeData.links.forEach(linkData => {
                            const sourceNode = graph.getCell(linkData.source.id);
                            const targetNode = graph.getCell(linkData.target.id);

                            if (sourceNode && targetNode) {
                                createConnection(sourceNode, targetNode, linkData.label || '');
                            }
                        });
                    }

                    updateStats();
                    updateStatus('树已从JSON文件导入', 'success');
                    ensureButtonsVisible();
                } catch (error) {
                    updateStatus('导入失败: ' + error.message, 'error');
                }
            };
            reader.readAsText(file);
        };

        input.click();
    }

    // 缩放功能
    function zoomIn() {
        const scale = paper.scale();
        paper.scale(scale.sx * 1.2, scale.sy * 1.2);
        updateZoomDisplay();
    }

    function zoomOut() {
        const scale = paper.scale();
        paper.scale(scale.sx / 1.2, scale.sy / 1.2);
        updateZoomDisplay();
    }

    function resetZoom() {
        paper.scale(1, 1);
        updateZoomDisplay();
    }

    function fitToScreen() {
        paper.scaleContentToFit();
        updateZoomDisplay();
    }

    function centerContent() {
        const elements = graph.getElements();
        if (elements.length === 0) return;

        const paperWidth = paper.el.clientWidth;
        const paperHeight = paper.el.clientHeight;

        // 计算所有元素的边界
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

        elements.forEach(el => {
            const pos = el.position();
            const size = el.size();
            minX = Math.min(minX, pos.x);
            minY = Math.min(minY, pos.y);
            maxX = Math.max(maxX, pos.x + size.width);
            maxY = Math.max(maxY, pos.y + size.height);
        });

        const contentWidth = maxX - minX;
        const contentHeight = maxY - minY;
        const centerX = minX + contentWidth / 2;
        const centerY = minY + contentHeight / 2;

        paper.translate(
            paperWidth / 2 - centerX,
            paperHeight / 2 - centerY
        );

        updateStatus('内容已居中', 'success');
    }

    function showGridToggle() {
        showGrid = !showGrid;
        paper.options.drawGrid = showGrid ? { name: 'mesh' } : false;
        paper.drawGrid();

        updateStatus('网格显示: ' + (showGrid ? '开启' : '关闭'), showGrid ? 'success' : 'info');
    }

    function clearAll() {
        if (confirm('确定要清空整个画布吗？此操作不可撤销！')) {
            graph.clear();
            currentNodeId = 1;
            currentConnectionId = 1;
            clearSelection();
            clearEditForm();
            updateStats();
            updateStatus('画布已清空', 'success');
        }
    }

    // 设置快捷键
    function setupShortcuts() {
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'Escape':
                    if (connectionMode) {
                        cancelConnectionMode();
                    } else {
                        clearSelection();
                        clearEditForm();
                    }
                    break;
                case 'Delete':
                    deleteSelected();
                    break;
                case 's':
                case 'S':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        saveTree();
                    }
                    break;
                case 'l':
                case 'L':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        loadTree();
                    }
                    break;
                case '+':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        zoomIn();
                    }
                    break;
                case '-':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        zoomOut();
                    }
                    break;
                case '0':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        fitToScreen();
                    }
                    break;
                case 'c':
                case 'C':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        startConnection();
                    }
                    break;
                case 'a':
                case 'A':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        autoLayout();
                    }
                    break;
                case 'e':
                case 'E':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        exportTree();
                    }
                    break;
            }
        });
    }
</script>
