<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师课堂 - 课堂互动系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.05),
                rgba(0, 255, 255, 0.05) 1px,
                transparent 1px,
                transparent 20px
            );
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                rgba(255, 0, 255, 0.05),
                rgba(255, 0, 255, 0.05) 1px,
                transparent 1px,
                transparent 20px
            );
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            position: relative;
            z-index: 1;
        }

        .container h2, .container h4, .container h5 {
            color: #00ffff;
            text-shadow: 0 0 3px rgba(0, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 675px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .video-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
            pointer-events: none;
        }

        .video-element {
            width: 100%;
            height: 100%;
            display: block;
        }

        .barrage-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .barrage-input-area {
            margin-top: 20px;
            padding: 20px;
            background: rgba(10, 10, 20, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .barrage-input-area h4 {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        .barrage-controls {
            margin-top: 10px;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 2px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
        }

        .form-control:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .form-select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 2px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
        }

        .form-select:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .btn {
            border-radius: 2px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        .btn-primary {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .btn-primary:hover {
            background: rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.5);
            color: #00ffff;
        }

        .btn-secondary:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .btn-warning {
            background: rgba(255, 255, 0, 0.2);
            border: 1px solid #ffff00;
            color: #ffff00;
            box-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
        }

        .btn-warning:hover {
            background: rgba(255, 255, 0, 0.3);
            border-color: #ffff00;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.8);
        }

        .btn-danger {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .btn-danger:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }

        .btn-success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .btn-success:hover {
            background: rgba(0, 255, 0, 0.3);
            border-color: #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
        }

        .text-muted {
            color: #00ff00 !important;
        }

        .font-weight-bold {
            color: #00ffff !important;
        }

        .comment-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .comment-list::-webkit-scrollbar {
            width: 6px;
        }

        .comment-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }

        .comment-list::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.5);
            border-radius: 3px;
        }

        .comment-item {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 2px;
            border-left: 4px solid #00ffff;
            background: rgba(0, 0, 0, 0.5);
        }

        .comment-item.teacher {
            border-left-color: #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }

        .comment-item.student {
            border-left-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .comment-item.system {
            border-left-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .comment-author .name {
            font-weight: bold;
            color: #00ffff;
            font-family: 'Courier New', monospace;
        }

        .comment-author .badge {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border: 1px solid #00ffff;
            border-radius: 2px;
        }

        .comment-content {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .comment-meta {
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .comment-tips {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        /* 弹幕关键词分析样式 */
        #keywordAnalysis {
            color: #00ffff;
            font-family: 'Courier New', monospace;
        }

        #keywordAnalysis h6 {
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }

        #keywordAnalysis .keyword-item {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        #keywordAnalysis .keyword-item:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #keywordAnalysis .keyword-name {
            font-weight: bold;
            color: #00ffff;
            margin-right: 10px;
        }

        #keywordAnalysis .keyword-count {
            color: #00ff00;
            font-size: 12px;
        }

        #keywordAnalysis .keyword-bar {
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        #keywordAnalysis .keyword-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.5), rgba(0, 255, 255, 0.8));
            border-radius: 4px;
            transition: width 1s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        /* 智能推荐样式 */


        .bg-white {
            background: rgba(10, 10, 20, 0.8) !important;
            border: 1px solid rgba(0, 255, 255, 0.3) !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2) !important;
        }

        .bg-light {
            background: rgba(10, 10, 20, 0.8) !important;
            border: 1px solid rgba(0, 255, 255, 0.3) !important;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2) !important;
        }

        .bg-info {
            background: rgba(0, 255, 255, 0.1) !important;
        }

        .border {
            border: 1px solid rgba(0, 255, 255, 0.3) !important;
        }

        .border-info {
            border: 1px solid rgba(0, 255, 255, 0.3) !important;
        }

        .rounded {
            border-radius: 2px !important;
        }

        .shadow {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2) !important;
        }

        .border-dashed {
            border-style: dashed !important;
            border-color: rgba(0, 255, 255, 0.3) !important;
        }

        .text-primary {
            color: #00ffff !important;
        }

        .text-center {
            color: #00ffff !important;
        }

        .classroom-id-container {
            color: #00ffff;
            font-family: 'Courier New', monospace;
        }

        /* 视频树样式 */
        #videoTreeContainer {
            height: 400px;
            overflow: auto;
        }

        .video-node {
            padding: 8px;
            margin: 4px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .video-node:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .video-node.active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .video-node span {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            font-weight: bold;
        }

        .video-node-children {
            margin-left: 20px;
            margin-top: 4px;
        }

        /* 视频列表样式 */
        .video-item {
            padding: 10px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .video-item:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .video-item.active {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .video-item-title {
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .video-item-info {
            color: #00ff00;
            font-size: 0.9em;
        }
    </style>
<script src="/js/app-config.js"></script>
<script src="/js/ui-common.js"></script>
</head>
<body>
    <input type="hidden" id="classroomTeacherId" th:value="${teacherId}">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>教师课堂 - 课堂互动系统</h2>
            <div class="d-flex align-items-center gap-4">
                <!-- PPT集成区域 -->
                <div class="ppt-integration">
                    <a th:href="@{/kdocs(teacherId=${teacherId})}" class="btn btn-primary">
                        <i class="fas fa-file-powerpoint"></i> 打开PPT课堂
                    </a>
                </div>
                <div class="classroom-id-container">
                    <span class="text-muted">课堂ID:</span>
                    <span id="classroomId" class="mx-2 font-weight-bold" th:text="${classroom.id}"></span>
                    <button id="copyClassroomIdBtn" class="btn btn-sm btn-primary" onclick="copyClassroomId()">
                        <i class="fas fa-copy"></i> 复制
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 视频和Canvas弹幕层 -->
        <div class="video-wrapper mb-4">
            <video 
                id="videoRef" 
                class="video-element" 
                controls 
                autoplay 
                muted 
                src="" 
                type="video/mp4"
                poster="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=video%20player%20placeholder%20with%20play%20button&image_size=landscape_16_9"
            >
                您的浏览器不支持HTML5视频播放
                <source src="" type="video/mp4">
            </video>
            <canvas id="canvasRef" class="barrage-canvas"></canvas>
        </div>
        
        <!-- 弹幕输入区域 -->
        <div class="barrage-input-area">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>发送弹幕</h4>
                <div class="d-flex gap-2">
                    <button 
                        id="toggleDanmakuBtn" 
                        class="btn btn-warning"
                        onclick="toggleStudentDanmaku()"
                    >
                        <i class="fas fa-comment-slash"></i> 禁止学生发弹幕
                    </button>
                    <button 
                        id="toggleAllMessagesBtn" 
                        class="btn btn-danger"
                        onclick="toggleStudentAllMessages()"
                    >
                        <i class="fas fa-ban"></i> 禁止学生发消息
                    </button>
                </div>
            </div>
            <div class="row">
                <div class="col-md-8">
                    <input 
                        type="text" 
                        id="barrageInput" 
                        class="form-control" 
                        placeholder="输入弹幕内容..."
                        maxlength="50"
                    >
                </div>
                <div class="col-md-4">
                    <button 
                        id="sendBarrageBtn" 
                        class="btn btn-primary w-100"
                    >
                        发送弹幕
                    </button>
                </div>
            </div>
            <div class="barrage-controls">
                <div class="row mt-2">
                    <div class="col-md-4">
                        <label class="form-label">字体大小</label>
                        <select id="fontSizeSelect" class="form-select">
                            <option value="20">小</option>
                            <option value="24" selected>中</option>
                            <option value="28">大</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">弹幕颜色</label>
                        <input 
                            type="color" 
                            id="colorPicker" 
                            class="form-control form-control-color"
                            value="#ffffff"
                        >
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">弹幕模式</label>
                        <select id="modeSelect" class="form-select">
                            <option value="1" selected>滚动</option>
                            <option value="2">顶部</option>
                            <option value="3">底部</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 评论区 -->
        <div class="mt-4 p-4 bg-white rounded shadow">
            <div class="comment-header d-flex justify-content-between align-items-center mb-3">
                <h4><i class="fas fa-comments"></i> 课堂讨论</h4>
                <div class="d-flex align-items-center gap-3">
                    <button 
                        id="toggleCommentBtn" 
                        class="btn btn-secondary"
                        onclick="toggleStudentComments()"
                    >
                        <i class="fas fa-comment-slash"></i> 禁止学生发评论
                    </button>
                    <span id="commentCount" class="text-muted">0 条评论</span>
                </div>
            </div>
            
            <div class="comment-list" id="commentList" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px; padding-right: 10px;">
                <div class="comment-item system p-3 mb-2 rounded border-left-4 border-warning bg-light">
                    <div class="comment-author d-flex align-items-center mb-2">
                        <i class="fas fa-info-circle mr-2"></i>
                        <span class="font-weight-bold">系统</span>
                        <span class="ml-2 px-2 py-0.5 bg-warning text-white text-xs rounded">系统消息</span>
                    </div>
                    <div class="comment-content">欢迎使用课堂讨论功能！您可以在这里与学生进行实时交流。</div>
                    <div class="comment-meta text-xs text-muted mt-2">
                        <span>刚刚</span>
                    </div>
                </div>
            </div>
            
            <div class="comment-input-area">
                <div class="row">
                    <div class="col-md-9">
                        <textarea 
                            id="commentInput" 
                            class="form-control" 
                            placeholder="输入评论内容...（按 Ctrl+Enter 发送）"
                            rows="3"
                            maxlength="200"
                        ></textarea>
                    </div>
                    <div class="col-md-3">
                        <div class="d-flex flex-column gap-2">
                            <button 
                                id="sendCommentBtn" 
                                class="btn btn-primary w-100"
                                onclick="sendComment()"
                            >
                                发送评论
                            </button>
                            <button 
                                id="clearCommentBtn" 
                                class="btn btn-secondary w-100"
                                onclick="clearCommentInput()"
                            >
                                清空
                            </button>
                        </div>
                    </div>
                </div>
                <div class="comment-tips text-xs text-muted mt-2 text-right">
                    按 Ctrl+Enter 快速发送
                </div>
            </div>
        </div>

        <!-- 智能推荐区域 -->
        <div class="mt-4 p-4 bg-info bg-opacity-10 rounded border border-info">
            <h4><i class="fas fa-robot"></i> 智能视频推荐</h4>
            <div class="row">
    
                <!-- 关键词分析 -->
                <div class="col-md-12">
                    <div class="bg-white p-3 rounded shadow">
                        <h5>弹幕关键词分析</h5>
                        <div id="keywordAnalysis" class="mt-3">
                            <div class="text-center py-4 text-muted">
                                <i class="fas fa-chart-pie fa-2x mb-2"></i>
                                <p>正在收集和分析弹幕...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 视频树形结构 -->
        <div class="mt-4 p-4 bg-light rounded">
            <h4><i class="fas fa-sitemap"></i> 视频树形结构</h4>
            <div class="border border-gray-200 rounded-lg p-4 bg-white">
                <div id="videoTreeContainer" style="height: 400px; border: 1px solid #e0e0e0; border-radius: 4px;">
                    <div class="text-center py-8 text-muted">
                        <i class="fas fa-tree fa-3x mb-3"></i>
                        <p>加载视频树形结构...</p>
                    </div>
                </div>
                <div class="mt-3 d-flex justify-content-between">
                    <button id="refreshTreeBtn" class="btn btn-outline-primary">
                        <i class="fas fa-sync"></i> 刷新树结构
                    </button>
                    <button id="expandAllBtn" class="btn btn-outline-secondary">
                        <i class="fas fa-plus-square"></i> 展开全部
                    </button>
                    <button id="collapseAllBtn" class="btn btn-outline-secondary">
                        <i class="fas fa-minus-square"></i> 收起全部
                    </button>
                </div>
            </div>
        </div>

        <!-- 文件管理 -->
        <div class="mt-4 p-4 bg-light rounded">
            <h4><i class="fas fa-folder"></i> 文件管理</h4>
            <div class="border border-gray-200 rounded-lg p-4 bg-white">
                <div class="mb-4">
                    <h5>删除文件</h5>
                    <div class="mb-3">
                        <label class="form-label">选择文件类型</label>
                        <select id="fileTypeSelect" class="form-select">
                            <option value="video">视频文件</option>
                            <option value="json">JSON文件</option>
                        </select>
                    </div>
                    <div id="videoFileList" class="mb-3">
                        <label class="form-label">选择视频文件</label>
                        <select id="videoFileSelect" class="form-select">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div id="jsonFileList" class="mb-3" style="display: none;">
                        <label class="form-label">选择JSON文件</label>
                        <select id="jsonFileSelect" class="form-select">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <button id="deleteFileBtn" class="btn btn-danger">
                        <i class="fas fa-trash"></i> 删除选中文件
                    </button>
                </div>
            </div>
        </div>

        <!-- 学生观点面板 -->
        <div class="mt-4 p-4 bg-light rounded">
            <h4><i class="fas fa-lightbulb"></i> 学生观点</h4>
            <div class="border border-gray-200 rounded-lg p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span id="opinionCount" class="text-muted">0 条观点</span>
                    <div class="d-flex gap-2">
                        <button id="selectAllOpinionsBtn" class="btn btn-sm btn-secondary" onclick="selectAllOpinions()">
                            <i class="fas fa-check-square"></i> 全选
                        </button>
                        <button id="deselectAllOpinionsBtn" class="btn btn-sm btn-secondary" onclick="deselectAllOpinions()">
                            <i class="fas fa-square"></i> 取消全选
                        </button>
                        <button id="exportOpinionsBtn" class="btn btn-sm btn-success" onclick="exportSelectedOpinions()">
                            <i class="fas fa-download"></i> 导出选中为TXT
                        </button>
                    </div>
                </div>

        // 视频预加载管理器
        class VideoPreloader {
            constructor() {
                this.preloadedVideos = new Map();
                this.maxPreloadSize = 8 * 1024 * 1024; // 8MB 预加载大小
                this.maxConcurrentPreloads = 3;        // 最大同时预加载数量
            }
            
            // 预加载相邻子节点
            preloadAdjacentNodes(currentNodeId) {
                console.log(`开始预加载相邻子节点: ${currentNodeId}`);
                
                // 获取所有相邻子节点（通过link连接）
                const adjacentNodes = getChildNodes(currentNodeId);
                
                if (adjacentNodes.length === 0) {
                    console.log('当前节点没有相邻子节点');
                    return;
                }
                
                console.log(`找到 ${adjacentNodes.length} 个相邻子节点`);
                
                // 根据网络条件调整预加载策略
                const networkStrategy = this.getNetworkStrategy();
                const nodesToPreload = adjacentNodes.slice(0, Math.min(adjacentNodes.length, networkStrategy.maxNodes));
                
                console.log(`根据网络条件，预加载 ${nodesToPreload.length} 个节点`);
                
                // 按顺序预加载子节点
                nodesToPreload.forEach((node, index) => {
                    if (node.fileName) {
                        // 根据索引分配优先级
                        const priority = index === 0 ? 'high' : index === 1 ? 'medium' : 'low';
                        this.preloadVideo(node, priority);
                    }
                });
            }
            
            // 获取相邻子节点
            getAdjacentChildNodes(currentNodeId) {
                // 调用现有的 getChildNodes 函数获取子节点
                return getChildNodes(currentNodeId);
            }
            
            // 预加载视频
            preloadVideo(node, priority) {
                if (!this.preloadedVideos.has(node.id)) {
                    console.log(`预加载视频 [${priority}]: ${node.name}`);
                    
                    const videoUrl = `/video/stream/${node.fileName}`;
                    // 根据优先级调整预加载大小
                    const preloadSize = this.getPreloadSizeByPriority(priority);
                    
                    // 发送范围请求，只预加载部分内容
                    fetch(videoUrl, {
                        method: 'GET',
                        headers: {
                            'Range': `bytes=0-${preloadSize}`
                        }
                    })
                    .then(response => {
                        if (response.ok || response.status === 206) {
                            console.log(`预加载视频 ${node.name} 成功`);
                            this.preloadedVideos.set(node.id, {
                                url: videoUrl,
                                priority: priority,
                                timestamp: Date.now()
                            });
                        }
                    })
                    .catch(error => {
                        console.error(`预加载视频 ${node.name} 失败:`, error);
                    });
                }
            }
            
            // 根据优先级获取预加载大小
            getPreloadSizeByPriority(priority) {
                switch (priority) {
                    case 'high':
                        return 10 * 1024 * 1024; // 高优先级：10MB
                    case 'medium':
                        return 6 * 1024 * 1024;  // 中优先级：6MB
                    case 'low':
                        return 3 * 1024 * 1024;   // 低优先级：3MB
                    default:
                        return 5 * 1024 * 1024;   // 默认：5MB
                }
            }
            
            // 获取网络策略
            getNetworkStrategy() {
                if (!('connection' in navigator)) {
                    return { effectiveType: 'unknown', maxNodes: 3 };
                }
                
                const connection = navigator.connection;
                let maxNodes;
                
                switch (connection.effectiveType) {
                    case '4g':
                        maxNodes = 5;  // 4G：最多预加载5个节点
                        break;
                    case '3g':
                        maxNodes = 3;  // 3G：最多预加载3个节点
                        break;
                    default:
                        maxNodes = 2;  // 其他：最多预加载2个节点
                        break;
                }
                
                return {
                    effectiveType: connection.effectiveType,
                    maxNodes: maxNodes
                };
            }
            
            // 清理过期预加载
            cleanup() {
                const now = Date.now();
                for (const [nodeId, info] of this.preloadedVideos.entries()) {
                    if (now - info.timestamp > 5 * 60 * 1000) { // 5分钟过期
                        this.preloadedVideos.delete(nodeId);
                        console.log(`清理过期预加载: ${nodeId}`);
                    }
                }
            }
            
            // 检查视频是否已预加载
            isPreloaded(nodeId) {
                return this.preloadedVideos.has(nodeId);
            }
        }
        
        // 弹幕渲染器类
        class BarrageRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.barrages = [];
                this.animationFrameId = null;
            }
            
            addBarrage(barrage) {
                console.log('添加弹幕:', barrage);
                this.barrages.push(barrage);
                if (!this.animationFrameId) {
                    this.start();
                }
            }
            
            start() {
                if (!this.animationFrameId) {
                    this.draw();
                }
            }
            
            stop() {
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                }
            }
            
            draw() {
                // 清除画布
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制并更新弹幕
                const activeBarrages = [];
                
                for (const barrage of this.barrages) {
                    // 保存当前样式
                    this.ctx.save();
                    
                    // 设置弹幕样式
                    this.ctx.font = `bold ${barrage.fontSize}px sans-serif`;
                    this.ctx.fillStyle = barrage.color;
                    this.ctx.strokeStyle = '#000';
                    this.ctx.lineWidth = 3;
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                    this.ctx.shadowBlur = 2;
                    this.ctx.shadowOffsetX = 1;
                    this.ctx.shadowOffsetY = 1;
                    
                    // 计算文字宽度
                    const textWidth = this.ctx.measureText(barrage.text).width;
                    
                    // 绘制文字
                    this.ctx.strokeText(barrage.text, barrage.x, barrage.y);
                    this.ctx.fillText(barrage.text, barrage.x, barrage.y);
                    
                    // 更新位置 - 减慢弹幕速度
                    barrage.x -= 1; // 原来是3，现在改为1
                    
                    // 恢复样式
                    this.ctx.restore();
                    
                    // 只保留在画布内的弹幕
                    if (barrage.x > -textWidth) {
                        activeBarrages.push(barrage);
                    }
                }
                
                // 更新弹幕列表
                this.barrages = activeBarrages;
                
                // 循环动画
                this.animationFrameId = requestAnimationFrame(() => this.draw());
            }
            
            clear() {
                this.barrages = [];
            }
        }
        
        // WebSocket管理器类
        class WebSocketManager {
            constructor(url, options = {}) {
                this.url = url.replace('http://', 'ws://').replace('https://', 'wss://');
                this.options = {
                    reconnectInterval: 3000,
                    maxReconnectAttempts: 5,
                    ...options
                };
                this.ws = null;
                this.reconnectAttempts = 0;
                this.callbacks = {
                    onOpen: [],
                    onMessage: [],
                    onClose: [],
                    onError: []
                };
                this.connect();
            }
            
            connect() {
                try {
                    // 使用原生WebSocket
                    console.log('使用原生WebSocket连接');
                    console.log('WebSocket连接URL:', this.url);
                    this.ws = new WebSocket(this.url);
                    
                    this.ws.onopen = (event) => {
                        console.log('WebSocket连接已建立');
                        this.reconnectAttempts = 0;
                        this.callbacks.onOpen.forEach(callback => callback(event));
                    };
                    
                    this.ws.onmessage = (event) => {
                        this.callbacks.onMessage.forEach(callback => callback(event));
                    };
                    
                    this.ws.onclose = (event) => {
                        console.log('WebSocket连接已关闭', event.code, event.reason);
                        this.callbacks.onClose.forEach(callback => callback(event));
                        
                        // 尝试重新连接
                        if (this.reconnectAttempts < this.options.maxReconnectAttempts) {
                            this.reconnectAttempts++;
                            console.log(`尝试重新连接 (${this.reconnectAttempts}/${this.options.maxReconnectAttempts})`);
                            setTimeout(() => this.connect(), this.options.reconnectInterval);
                        }
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket错误:', error);
                        this.callbacks.onError.forEach(callback => callback(error));
                    };
                } catch (error) {
                    console.error('WebSocket连接失败:', error);
                    this.callbacks.onError.forEach(callback => callback(error));
                }
            }
            
            send(data) {
                if (this.ws && (this.ws.readyState === 1)) {
                    this.ws.send(JSON.stringify(data));
                    return true;
                }
                return false;
            }
            
            on(event, callback) {
                if (this.callbacks[event]) {
                    this.callbacks[event].push(callback);
                }
            }
            
            close() {
                if (this.ws) {
                    this.ws.close();
                }
            }
        }

                            // 尝试从视频树数据中找到匹配的节点

                            // 获取课堂ID
                            const classroomId = getClassroomId();
                            
                            // 优先从对应课堂的localStorage中读取视频树数据
                            let storedData = null;
                            if (classroomId) {
                                storedData = localStorage.getItem('videoTreeData_' + classroomId);
                            }
                            
                            // 如果对应课堂没有视频树数据，尝试使用通用的视频树数据
                            if (!storedData) {
                                storedData = localStorage.getItem('videoTreeData');
                            }
                            
                            if (storedData) {
                                try {

        // 根据links字段建立节点之间的父子关系
        function buildNodeHierarchy(videoTree) {
            if (!videoTree || !videoTree.elements || !videoTree.links) {
                console.error('视频树数据不完整');
                return;
            }
            
            console.log('开始建立节点父子关系...');
            
            // 首先为所有节点添加children属性
            videoTree.elements.forEach(node => {
                node.children = [];
            });
            
            // 根据links字段建立父子关系
            videoTree.links.forEach(link => {
                // 处理不同格式的link结构
                let sourceId, targetId;
                
                if (link.source && link.target) {
                    // 格式1: {"source": "node_1", "target": "node_2"}
                    sourceId = typeof link.source === 'string' ? link.source : link.source.id;
                    targetId = typeof link.target === 'string' ? link.target : link.target.id;
                } else if (link.sourceId && link.targetId) {
                    // 格式2: {"sourceId": "node_1", "targetId": "node_2"}
                    sourceId = link.sourceId;
                    targetId = link.targetId;
                }
                
                if (sourceId && targetId) {
                    const sourceNode = videoTree.elements.find(node => node.id === sourceId);
                    const targetNode = videoTree.elements.find(node => node.id === targetId);
                    
                    if (sourceNode && targetNode) {
                        sourceNode.children.push(targetNode);
                        console.log(`建立父子关系: ${sourceId} -> ${targetId}`);
                    } else {
                        console.log(`未找到节点: source=${sourceId}, target=${targetId}`);
                    }
                }
            });
            
            // 打印所有节点的子节点信息
            videoTree.elements.forEach(node => {
                console.log(`节点 ${node.id} (${node.name}) 的子节点:`, node.children.map(child => child.name));
            });
            
            console.log('节点父子关系建立完成');
        }

        // 播放视频
        function playVideo(node) {
            console.log('播放视频:', node.name);
            
            // 更新当前视频节点
            currentVideoNode = node;
            
            // 更新视频树的选中状态
            const videoNodes = document.querySelectorAll('.video-node');
            videoNodes.forEach(videoNode => {
                videoNode.classList.remove('active');
            });
            
            // 找到并激活当前节点
            const currentNodeElement = Array.from(videoNodes).find(element => {
                // 简单匹配，实际应用中可能需要更精确的匹配
                return element.textContent.trim() === node.name.trim();
            });
            
            if (currentNodeElement) {
                currentNodeElement.classList.add('active');
            }
            
            // 播放视频
            if (node.fileName) {
                const videoUrl = `/video/stream/${node.fileName}`;
                videoRef.src = videoUrl;
                videoRef.load();
                videoRef.play().catch(error => {
                    console.error('视频播放失败:', error);
                    showMessage('视频播放失败，请检查视频文件', 'error');
                });
                
                showMessage(`正在播放视频: ${node.name}`, 'success');
                
                // 预加载相邻子节点
                videoPreloader.preloadAdjacentNodes(node.id);
            }
        }

        // 获取子节点
        function getChildNodes(nodeId) {
            console.log(`获取节点 ${nodeId} 的子节点`);
            
            if (!videoTree || !videoTree.elements) {
                console.error('视频树数据不存在');
                return [];
            }
            
            // 递归查找节点
            function findNode(nodes) {
                for (const node of nodes) {
                    if (node.id === nodeId) {
                        return node;
                    }
                    if (node.children && node.children.length > 0) {
                        const found = findNode(node.children);
                        if (found) {
                            return found;
                        }
                    }
                }
                return null;
            }
            
            const node = findNode(videoTree.elements);
            if (node && node.children) {
                console.log(`找到 ${node.children.length} 个子节点`);
                return node.children;
            }
            
            console.log('未找到子节点');
            return [];
        }

        // 初始化WebSocket连接
        function initWebSocket() {
            console.log('初始化WebSocket连接...');
            
            // 获取课堂ID
            const classroomId = getClassroomId();
            if (!classroomId) {
                console.error('无法获取课堂ID，WebSocket连接初始化失败');
                return;
            }
            
            // 构建WebSocket URL - 连接到 /ws/teacher/{classroomId} 端点，使用原生WebSocket
            const wsUrl = AppConfig.ws('/ws/teacher/' + classroomId);
            console.log('WebSocket连接URL:', wsUrl);
            
            // 创建WebSocket管理器
            wsManager = new WebSocketManager(wsUrl, {
                reconnectInterval: 3000,
                maxReconnectAttempts: 5
            });
            
            // 绑定WebSocket事件
            wsManager.on('onOpen', (event) => {
                console.log('WebSocket连接已建立');
                showMessage('WebSocket连接已建立', 'success');
                
                // 发送教师加入消息
                wsManager.send({
                    type: 'TEACHER_JOIN',
                    classroomId: classroomId,
                    role: 'teacher'
                });
            });
            
            wsManager.on('onMessage', (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('收到WebSocket消息:', data);
                    
                    // 处理不同类型的消息
                    switch (data.type) {
                        case 'DANMAKU_RECEIVED':
                            handleDanmakuMessage(data.data);
                            break;
                        case 'COMMENT_RECEIVED':
                            handleCommentMessage(data.data);
                            break;
                        case 'TEACHER_DANMAKU':
                            handleDanmakuMessage(data.danmaku);
                            break;
                        case 'STUDENT_DANMAKU':
                            handleDanmakuMessage(data.data);
                            break;
                        case 'OPINION_RECEIVED':
                            handleOpinionMessage(data.data);
                            break;
                        default:
                            console.log('未知消息类型:', data.type);
                    }
                } catch (error) {
                    console.error('解析WebSocket消息失败:', error);
                }
            });
            
            wsManager.on('onError', (error) => {
                console.error('WebSocket错误:', error);
                showMessage('WebSocket连接错误', 'error');
            });
            
            wsManager.on('onClose', (event) => {
                console.log('WebSocket连接已关闭', event.code, event.reason);
                showMessage('WebSocket连接已关闭', 'warning');
            });
        }

        // 分析弹幕中的关键词
        function analyzeKeywords(text) {
            console.log('分析弹幕关键词:', text);
            if (!currentVideoNode) {
                console.log('当前节点不存在');
                return;
            }
            
            // 确保currentVideoNode有children属性
            if (!currentVideoNode.children) {
                console.log('当前节点没有children属性，尝试从videoTree中获取');
                // 从videoTree中重新获取节点信息
                if (videoTree && videoTree.elements) {
                    const node = videoTree.elements.find(n => n.id === currentVideoNode.id);
                    if (node && node.children) {
                        currentVideoNode.children = node.children;
                        console.log('已从videoTree中获取子节点信息');
                    } else {
                        console.log('无法获取子节点信息');
                        return;
                    }
                } else {
                    console.log('videoTree不存在');
                    return;
                }
            }
            
            console.log('当前节点:', currentVideoNode.name, '子节点数量:', currentVideoNode.children.length);
            
            // 遍历当前节点的所有子节点
            currentVideoNode.children.forEach(childNode => {
                console.log('检查子节点:', childNode.name, '关键词:', childNode.keywords);
                
                // 处理不同格式的关键词属性
                let keywords = [];
                if (childNode.keywords) {
                    if (Array.isArray(childNode.keywords)) {
                        keywords = childNode.keywords;
                    } else if (typeof childNode.keywords === 'object') {
                        // 尝试从对象中提取关键词
                        console.log('关键词是对象，尝试提取');
                        // 检查对象是否有特定的关键词属性
                        if (childNode.keywords.keywords) {
                            if (Array.isArray(childNode.keywords.keywords)) {
                                keywords = childNode.keywords.keywords;
                            } else {
                                keywords = [childNode.keywords.keywords];
                            }
                        } else {
                            // 从对象中获取键作为关键词
                            keywords = Object.keys(childNode.keywords);
                        }
                    } else if (typeof childNode.keywords === 'string') {
                        keywords = [childNode.keywords];
                    }
                }
                
                if (keywords.length > 0) {
                    console.log('处理关键词数组:', keywords);
                    // 检查弹幕中是否包含子节点的关键词
                    keywords.forEach(keyword => {
                        console.log('检查关键词:', keyword, '是否在弹幕中:', text.includes(keyword));
                        if (text.includes(keyword)) {
                            // 更新关键词计数
                            updateKeywordCount(childNode.id, keyword);
                        }
                    });
                } else {
                    console.log('子节点没有关键词属性或关键词为空');
                }
            });
        }
        
        // 更新关键词计数
        function updateKeywordCount(nodeId, keyword) {
            const key = `${nodeId}:${keyword}`;
            const currentCount = keywordCounts.get(key) || 0;
            keywordCounts.set(key, currentCount + 1);
            console.log(`关键词计数更新: ${nodeId}:${keyword} = ${currentCount + 1}`);
        }
        
        // 计算子节点的关键词占比
        function calculateKeywordRatios() {
            if (!currentVideoNode || !currentVideoNode.children) {
                return [];
            }
            
            const nodeRatios = [];
            
            // 计算每个子节点的关键词总计数
            currentVideoNode.children.forEach(childNode => {
                let totalCount = 0;
                
                // 处理不同格式的关键词属性，与analyzeKeywords函数保持一致
                let keywords = [];
                if (childNode.keywords) {
                    if (Array.isArray(childNode.keywords)) {
                        keywords = childNode.keywords;
                    } else if (typeof childNode.keywords === 'object') {
                        // 尝试从对象中提取关键词
                        console.log('关键词是对象，尝试提取');
                        // 检查对象是否有特定的关键词属性
                        if (childNode.keywords.keywords) {
                            if (Array.isArray(childNode.keywords.keywords)) {
                                keywords = childNode.keywords.keywords;
                            } else {
                                keywords = [childNode.keywords.keywords];
                            }
                        } else {
                            // 从对象中获取键作为关键词
                            keywords = Object.keys(childNode.keywords);
                        }
                    } else if (typeof childNode.keywords === 'string') {
                        keywords = [childNode.keywords];
                    }
                }
                
                if (keywords.length > 0) {
                    console.log('处理关键词数组:', keywords);
                    keywords.forEach(keyword => {
                        const key = `${childNode.id}:${keyword}`;
                        totalCount += keywordCounts.get(key) || 0;
                    });
                }
                
                nodeRatios.push({
                    node: childNode,
                    count: totalCount
                });
            });
            
            // 计算总关键词数
            const totalKeywords = nodeRatios.reduce((sum, item) => sum + item.count, 0);
            
            // 计算每个节点的占比
            nodeRatios.forEach(item => {
                item.ratio = totalKeywords > 0 ? (item.count / totalKeywords) * 100 : 0;
            });
            
            // 按占比排序（降序）
            nodeRatios.sort((a, b) => b.ratio - a.ratio);
            
            console.log('关键词占比计算结果:', nodeRatios);
            return nodeRatios;
        }
        
        // 根据关键词占比获取下一个视频
        function getNextVideoByKeywords() {
            const nodeRatios = calculateKeywordRatios();
            
            if (nodeRatios.length > 0) {
                // 返回占比最高的节点
                const topNode = nodeRatios[0];
                console.log(`根据关键词占比选择下一个视频: ${topNode.node.name} (占比: ${topNode.ratio.toFixed(2)}%)`);
                return topNode.node;
            }
            
            // 如果没有关键词数据，返回第一个子节点
            if (currentVideoNode && currentVideoNode.children && currentVideoNode.children.length > 0) {
                console.log('没有关键词数据，返回第一个子节点');
                return currentVideoNode.children[0];
            }
            
            return null;
        }

        function exportSelectedOpinions() {
            var selectedIds = [];
            teacherOpinionList.forEach(function(opinion) {
                if (opinion.selected && opinion.id) {
                    selectedIds.push(opinion.id);
                }
            });

            if (selectedIds.length === 0) {
                showMessage('请先勾选要导出的观点', 'warning');
                return;
            }

            var classroomId = getClassroomId();
            if (!classroomId) {
                showMessage('无法获取课堂ID', 'error');
                return;
            }

            fetch('/teacher/classroom/' + classroomId + '/opinions/export/txt', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(selectedIds)
            })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('导出失败');
                }
                return response.blob();
            })
            .then(function(blob) {
                var url = window.URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'opinions_' + classroomId + '_' + Date.now() + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                showMessage('导出成功，共 ' + selectedIds.length + ' 条观点', 'success');
            })
            .catch(function(error) {
                console.error('导出观点失败:', error);
                showMessage('导出失败: ' + error.message, 'error');
            });
        }

        // 获取下一个视频
        function getNextVideo(currentNodeId) {
            if (!videoTree || !videoTree.elements) {
                return null;
            }
            
            // 递归查找当前节点
            function findNode(nodes) {
                for (let i = 0; i < nodes.length; i++) {
                    const node = nodes[i];
                    if (node.id === currentNodeId) {
                        // 检查当前节点是否有子节点（按照link顺序）
                        if (node.children && node.children.length > 0) {
                            // 返回第一个子节点（按照link顺序）
                            return node.children[0];
                        }
                        // 如果没有子节点，停止播放
                        return null;
                    }
                    if (node.children && node.children.length > 0) {
                        const found = findNode(node.children);
                        if (found) {
                            return found;
                        }
                    }
                }
                return null;
            }
            
            return findNode(videoTree.elements);
        }

        // 更新关键词分析
        function updateKeywordAnalysis() {
            const keywordAnalysis = document.getElementById('keywordAnalysis');
            if (keywordAnalysis) {
                // 从关键词计数中获取实际的关键词
                const keywordMap = new Map();
                keywordCounts.forEach((count, key) => {
                    const [nodeId, keyword] = key.split(':');
                    if (keywordMap.has(keyword)) {
                        keywordMap.set(keyword, keywordMap.get(keyword) + count);
                    } else {
                        keywordMap.set(keyword, count);
                    }
                });
                
                // 转换为数组并排序
                const keywords = Array.from(keywordMap.entries())
                    .map(([word, count]) => ({ word, count }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 5); // 只显示前5个关键词
                
                let html = '<div class="row">';
                if (keywords.length > 0) {
                    keywords.forEach((keyword, index) => {
                        const maxCount = Math.max(...keywords.map(k => k.count));
                        const percentage = maxCount > 0 ? (keyword.count / maxCount) * 100 : 0;
                        html += `
                            <div class="col-6 mb-2">
                                <div class="d-flex justify-content-between">
                                    <span>${keyword.word}</span>
                                    <span class="badge bg-info">${keyword.count}</span>
                                </div>
                                <div class="progress" style="height: 8px;">
                                    <div class="progress-bar bg-primary" role="progressbar" style="width: ${percentage}%" aria-valuenow="${keyword.count}" aria-valuemin="0" aria-valuemax="${maxCount}"></div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html += `
                        <div class="col-12 text-center py-4 text-muted">
                            <i class="fas fa-chart-pie fa-2x mb-2"></i>
                            <p>暂无弹幕关键词</p>
                        </div>
                    `;
                }
                html += '</div>';
                
                keywordAnalysis.innerHTML = html;
            }
        }
