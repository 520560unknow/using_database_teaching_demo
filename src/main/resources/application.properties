# 服务器配置
server.port=8080
server.servlet.context-path=/

# 数据库配置
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON存储配置
json.storage.enabled=true
json.storage.directory=json-storage
json.upload.path=json-upload

# Thymeleaf配置
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# 日志配置
logging.level.root=INFO
logging.level.com.example=DEBUG

# 文件上传配置
spring.servlet.multipart.enabled=true
# 视频与数据包整包导入可能远大于 10MB，这里放宽到 500MB
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=600MB

# WebSocket配置
spring.websocket.path=/ws

# Desktop launch behavior. The WPF shell embeds this page in WebView2, so the
# Spring Boot app must not open the system browser by default.
app.auto-open-browser=false
app.auto-open-url=http://localhost:8080/teacher/dashboard

# 本地 AI（llama.cpp / OpenAI 兼容接口）
ai.enabled=true
ai.base-url=http://127.0.0.1:8081
ai.model=D:/app/lamma/mode/Ling-3.0-tiny-Q5_K_M.gguf
ai.timeout-ms=45000
ai.corpus-dir=./ai-corpus
ai.log-dir=./ai-logs

# 身份默认值配置
app.identity.default-teacher-id=teacher_001
app.identity.default-student-id=student_001
app.identity.api-teacher-id=api_teacher

# 启动时是否初始化演示数据
app.demo-data=true

# 每次启动前是否清空上次运行产生的课堂、资料、问答与日志（false=保留历史数据，重启后课堂仍在）
app.reset-on-start=false
